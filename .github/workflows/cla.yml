name: CLA

# Asks each pull request author to sign CLA.md by commenting on the pull request, and records
# the signature in signatures/cla.json on the cla-signatures branch (the default branch's
# rulesets would block the bot's commits there).
on:
  issue_comment:
    types: [created]
  # pull_request_target runs this file from the default branch with a write token; it never
  # checks out or runs the pull request's code, so a fork can't change what runs here
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write  # commit signatures to the cla-signatures branch
  pull-requests: write  # comment, and lock the pull request once merged
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    # The action locks every pull request it sees closed, so a closed one runs it only when
    # merged: one closed unmerged stays open to comments
    if: >-
      (github.event_name == 'pull_request_target' &&
       (github.event.action != 'closed' || github.event.pull_request.merged)) ||
      (github.event.issue.pull_request &&
       (github.event.comment.body == 'recheck' ||
        github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'))
    env:
      # Bots, and Valency staff, whose work Valency already owns: the core-maintainers team
      # plus ElenaHenderson and francisco-the-man
      ALLOWLIST: dependabot[bot],github-actions[bot],copilot-swe-agent[bot],karthik,profjsb,curtisjm,ElenaHenderson,francisco-the-man
    steps:
      # Two gaps in the pinned action, closed before it runs. It reads only a pull request's
      # first 100 commits, so a contributor whose commits all come later would go unchecked.
      # And for a commit whose author (or committer) is not linked to a GitHub account it
      # matches the bare Git name against the allowlist, so a commit could claim to be by
      # someone on it. Reads only the API, never the pull request's code; prints commit SHAs,
      # never the names, which the contributor chose.
      - name: Check what the CLA action cannot
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number || github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: |
          count=$(gh api "repos/$REPO/pulls/$PR" --jq .commits)
          if [ "$count" -gt 100 ]; then
            echo "::error::This pull request has $count commits, more than the 100 the CLA check reads; squash it to 100 or fewer"
            exit 1
          fi
          claimed=$(gh api "repos/$REPO/pulls/$PR/commits?per_page=100" | jq -r --arg allow "$ALLOWLIST" '
            ($allow | ascii_downcase | split(",")) as $names
            | .[]
            | select(
                (.author == null and (.commit.author.name | ascii_downcase | IN($names[])))
                or (.committer == null and (.commit.committer.name | ascii_downcase | IN($names[])))
              )
            | .sha')
          if [ -n "$claimed" ]; then
            echo "::error::These commits give an allowlisted name without being linked to that GitHub account; commit with an email address on the account: $(echo "$claimed" | tr "\n" " ")"
            exit 1
          fi
      # contributor-assistant/github-action is archived (read-only since 2026-03), so this pin
      # (v2.6.1) can't move; replace it with a maintained fork if it stops working
      - name: CLA Assistant
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/valency-oss/open-canonical-review-schema/blob/main/CLA.md
          path-to-signatures: signatures/cla.json
          branch: cla-signatures
          allowlist: ${{ env.ALLOWLIST }}
          lock-pullrequest-aftermerge: true
