name: Prepare release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.repository == 'valency-oss/open-canonical-review-schema' &&
      github.ref == 'refs/heads/main' && !github.event.repository.private
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      UV_PYTHON: "3.12"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4
      - run: uv sync --locked
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .
      - run: uv build
      - run: uv run --no-sync python scripts/check_distribution.py dist
      - name: Read the version and its release notes
        id: metadata
        run: |
          uv run --no-sync python - <<'PY'
          import os
          import re
          import tomllib
          from pathlib import Path

          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          if not re.fullmatch(r"\d+\.\d+\.\d+", version):
              raise SystemExit(f"Expected a release version, got {version!r}")
          changelog = Path("CHANGELOG.md").read_text()
          _, heading, rest = changelog.partition(f"\n## {version}\n")
          notes = rest.split("\n## ", 1)[0].strip()
          if not heading or not notes:
              raise SystemExit("The release needs a changelog entry")
          Path(os.environ["RUNNER_TEMP"], "release-notes.md").write_text(notes + "\n")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"tag=v{version}\n")
          PY
      - name: Create a draft release with the tested artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.metadata.outputs.tag }}
        run: |
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            echo "Version $RELEASE_TAG already has a tag; published versions are immutable." >&2
            exit 1
          fi
          # A draft has no tag yet, so a second run would otherwise add a duplicate draft
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "A release for $RELEASE_TAG already exists; review or delete it first." >&2
            exit 1
          fi
          (cd dist && sha256sum -- *.whl *.tar.gz > SHA256SUMS)
          gh release create "$RELEASE_TAG" dist/*.whl dist/*.tar.gz dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft \
            --title "OCRS $RELEASE_TAG" --notes-file "$RUNNER_TEMP/release-notes.md"
