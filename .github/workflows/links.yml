name: Links

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Check links in the docs
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --no-progress
            --accept '200..=299,403,429'
            --exclude '\{value\}'
            --exclude '^https://example\.com/'
            --exclude '^https://github\.com/valency-oss/open-canonical-review-schema'
            README.md CONTRIBUTING.md CLA.md ADOPTERS.md CHANGELOG.md CODE_OF_CONDUCT.md
            SECURITY.md RELEASING.md THIRD_PARTY_NOTICES.md
            examples/README.md tests/fixtures/ai/README.md
          fail: true
