name: Generate Schema Documentation

on:
  push:
    branches: [main]
    paths:
      - 'src/ocrs/schemas/**'
      - 'src/ocrs/registry.py'  # the homepage diagram's arrows follow its exporters
      - 'versions/**'
      - 'site/**'
      - 'scripts/generate_docs.py'
      - '.github/workflows/docs.yml'
      - 'pyproject.toml'
      - 'uv.lock'
  workflow_dispatch:  # Allow manual triggering

permissions:
  contents: read

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.12"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --locked --extra docs

      - name: Generate documentation
        run: uv run --no-sync python scripts/generate_docs.py

      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: ./docs

  # Visibility is changed separately by an administrator, after release review.
  deploy:
    if: >-
      github.repository == 'valency-oss/open-canonical-review-schema' &&
      github.ref == 'refs/heads/main' && !github.event.repository.private
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
      - name: Verify public schema URLs
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          curl --fail --silent --show-error --retry 5 --retry-all-errors "${SITE_URL%/}/" --output /dev/null
          for schema in versions/v*/*.json; do
            relative="${schema#versions/}"
            curl --fail --silent --show-error --retry 5 --retry-all-errors \
              "${SITE_URL%/}/$relative" --output "$RUNNER_TEMP/schema.json"
            cmp "$schema" "$RUNNER_TEMP/schema.json"
          done
