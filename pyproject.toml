[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ocrs"
version = "0.7.2"
description = "Open Canonical Review Schema (OCRS) - schema + mappers for OpenReview, CMT, and narrative journal reviews."
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = ["jsonschema>=4.19.0", "pydantic>=2.5"]

[tool.setuptools.package-data]
ocrs = ["schemas/*.json"]

[project.optional-dependencies]
docs = ["json-schema-for-humans>=1.0.0"]

[dependency-groups]
dev = ["pytest>=8.0.0", "ruff>=0.14.0", "prek>=0.2.0"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.format]
quote-style = "double"
