repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.10
    hooks:
      # "--" ends Ruff's options, so a file the runner appends is a path even when its name
      # reads as an option (a path starting `--output-file=` would set where Ruff writes)
      - id: ruff-check
        args: ["--"]
      - id: ruff-format
        args: ["--"]
  - repo: local
    hooks:
      - id: format-schema
        name: format the schema in its house layout
        entry: python scripts/format_schema.py
        language: python
        files: ^(src/ocrs/schemas|versions/v[^/]+)/canonical-review\.schema\.json$
        pass_filenames: false
      - id: sync-example-schema
        name: sync $schema in examples
        entry: python scripts/sync_examples.py
        language: python
        files: ^(src/ocrs/schemas/canonical-review\.schema\.json|examples/.*\.json)$
        pass_filenames: false
      - id: build-crosswalk
        name: regenerate the crosswalk
        # uv, not an isolated hook env: the generator runs the mappers and imports the tests
        entry: uv run scripts/build_crosswalk.py
        language: system
        files: ^(src/ocrs/|tests/fixtures/|tests/test_roundtrip\.py|tests/test_real_reviews\.py|scripts/build_crosswalk\.py)
        pass_filenames: false
